<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hryvnia Hub — объявления Украины</title>
  <meta name="description" content="Hryvnia Hub — хаб объявлений: автомобили, недвижимость и бизнес.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="container nav">
      <a class="brand" href="#">
        <img class="logo" src="hryvnia-hub-logo.png" alt="Hryvnia Hub">
        <span>Hryvnia Hub</span>
      </a>
      <button class="btn btn-primary" id="openAdd">+ Добавить объявление</button>
      <select id="languageSwitcher" class="language-switcher">
        <option value="ru">🇷🇺 Русский</option>
        <option value="uk">🇺🇦 Українська</option>
        <option value="en">🇬🇧 English</option>
        <option value="pl">🇵🇱 Polski</option>
      </select>
    </div>
  </header>

  <!-- Категории: сразу под шапкой, одна горизонтальная строка, скролл без переноса -->
  <nav class="categories-bar" aria-label="Категорії">
    <div class="container">
      <div class="categories">
        <button class="category active" data-category="">
          <span>▦ Усі</span>
        </button>
        <button class="category" data-category="Автомобили">
          <span>🚗 Автомобілі</span>
        </button>
        <button class="category" data-category="Недвижимость">
          <span>🏠 Нерухомість</span>
        </button>
        <button class="category" data-category="Готовый бизнес">
          <span>💼 Готовий бізнес</span>
        </button>
        <button class="category" data-category="Инвестиции">
          <span>📈 Інвестиції</span>
        </button>
      </div>
    </div>
  </nav>

  <main>
    <section class="hero">
      <div class="container">

        <!-- Главный визуальный блок: SVG-иллюстрация -->
        <img
  class="hero-illustration"
  src="hero-banner.webp"
  alt="Автомобілі, нерухомість, готовий бізнес та інвестиції"
  loading="eager"
  fetchpriority="high"
/>
        <p class="hero-text">Автомобили, недвижимость и готовый бизнес — в одном месте.</p>

        <!-- Поисковая форма в виде белой карточки -->
        <div class="search-card">
          <div class="search-box">
            <input id="searchInput" type="search" placeholder="Что ищете? Например: Skoda Octavia">
            <select id="catalogRegionSelect" aria-label="Область">
              <option value="">Все области</option>
            </select>
            <div class="catalog-city-search">
              <input id="catalogCitySearchInput" type="search" autocomplete="off"
                placeholder="Введите название города" role="combobox" aria-autocomplete="list"
                aria-expanded="false" aria-controls="catalogCitySuggestions">
              <div id="catalogCitySuggestions" class="catalog-city-suggestions" role="listbox" hidden></div>
            </div>
            <button class="btn btn-dark" id="searchBtn">Найти</button>
          </div>
        </div>
      </div>
    </section>

    <section class="container section">
      <div class="section-head">
        <div>
          <p id="listingLabel" class="eyebrow">Листинг</p>
          <h2 id="latestListingsTitle">Последние объявления</h2>
        </div>
        <span id="resultCount" class="muted"></span>
      </div>
      <div id="listing" class="listing">
        <div class="empty">Загрузка объявлений…</div>
      </div>
    </section>
  </main>

  <div class="modal hidden" id="addModal">
    <div class="modal-card">
      <button class="modal-close" id="closeAdd">×</button>
      <p class="eyebrow">Новое объявление</p>
      <h2>Добавить объявление</h2>
      <form id="addForm">
        <label>Категория
          <select name="category" required>
            <option value="Автомобили">Автомобили</option>
            <option value="Недвижимость">Недвижимость</option>
            <option value="Готовый бизнес">Готовый бизнес</option>
            <option value="Инвестиции">Инвестиции</option>
          </select>
        </label>
        <label>Название
          <input name="title" required placeholder="Например: Skoda Octavia 1.6">
        </label>
        <label>Город
          <select id="cityRegionSelect" aria-label="Область">
            <option value="">Все области</option>
          </select>
          <div class="city-search">
            <input id="citySearchInput" type="search" required autocomplete="off"
              placeholder="Введите название города" role="combobox" aria-autocomplete="list"
              aria-expanded="false" aria-controls="citySuggestions">
            <div id="citySuggestions" class="city-suggestions" role="listbox" hidden></div>
            <input type="hidden" name="city_id" id="citySelect">
          </div>
        </label>
        <label>Цена, грн
          <input name="price" type="number" min="0" required placeholder="450000">
        </label>
        <label>Описание
          <textarea name="description" rows="4" placeholder="Коротко опишите предложение"></textarea>
        </label>
        <fieldset id="photoFields" class="photo-fields">
          <legend id="photoLabel">Фотографии</legend>
          <button id="photoPickerButton" class="btn" type="button">Добавить фотографии</button>
          <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden aria-labelledby="photoLabel" aria-describedby="photoHint photoMessage">
          <p id="photoHint" class="muted">До 10 фото: JPEG, PNG или WebP, до 10 МБ каждое. Первое фото — главное.</p>
          <p id="photoMessage" class="form-message" role="status" aria-live="polite"></p>
          <div id="photoPreview" class="photo-preview"></div>
        </fieldset>
        <button class="btn btn-primary full" type="submit">Опубликовать</button>
        <p id="formMessage" class="form-message"></p>
      </form>
    </div>
  </div>

  <footer class="footer">
    <div class="container">© 2026 Hryvnia Hub · MVP</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
