name: Security Scanner

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Security scan to run
        type: choice
        required: true
        default: full-security-audit
        options:
          - repository-scan
          - supabase-scan
          - full-security-audit
  schedule:
    - cron: "23 6 * * 1"
  push:
    paths:
      - "supabase/**"
      - "**/*.sql"
      - "security/**"
      - "package.json"
      - "package-lock.json"
      - "**/*.js"
      - "**/*.html"
      - ".github/workflows/security-audit.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "**/*.sql"
      - "security/**"
      - "package.json"
      - "package-lock.json"
      - "**/*.js"
      - "**/*.html"
      - ".github/workflows/security-audit.yml"

permissions:
  contents: read

jobs:
  repository-scan:
    name: Repository Scan
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'repository-scan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Run scanner tests
        run: npm run security:test
      - name: Run all application and scanner regression tests
        run: npm test
      - name: Check application JavaScript syntax
        run: npm run check:app
      - name: Run repository security scan
        id: scan
        if: always()
        run: npm run security:repository
      - name: Publish report
        if: always()
        run: if [ -f security-report.md ]; then cat security-report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-security-report
          path: security-report.*
          if-no-files-found: warn
          retention-days: 30

  supabase-scan:
    name: Supabase Scan
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'supabase-scan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Run scanner tests
        run: npm run security:test
      - name: Run all application and scanner regression tests
        run: npm test
      - name: Check application JavaScript syntax
        run: npm run check:app
      - name: Check Supabase structure
        shell: bash
        run: |
          if [ -d supabase/migrations ] && find supabase/migrations -type f -name '*.sql' -print -quit | grep -q .; then
            echo "SQL migration sources found."
          else
            echo "::warning::No Supabase SQL migrations found; database security checks will be NOT_RUN."
          fi
      - name: Run Supabase scan
        if: always()
        id: static-scan
        run: npm run security:supabase
      - name: Publish report
        if: always()
        run: if [ -f security-report.md ]; then cat security-report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-security-report
          path: security-report.*
          if-no-files-found: warn
          retention-days: 30

  full-security-audit:
    name: Full Security Audit
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || inputs.mode == 'full-security-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Run scanner tests
        run: npm run security:test
      - name: Run all application and scanner regression tests
        run: npm test
      - name: Check application JavaScript syntax
        run: npm run check:app
      - name: Check Supabase structure
        if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || inputs.mode == 'full-security-audit'
        shell: bash
        run: |
          if [ -d supabase/migrations ] && find supabase/migrations -type f -name '*.sql' -print -quit | grep -q .; then
            echo "SQL migration sources found."
          else
            echo "::warning::No Supabase SQL migrations found; database security checks will be NOT_RUN."
          fi
      - name: Run full security audit
        if: always()
        id: static-audit
        run: npm run security:audit
      - name: Publish report
        if: always()
        run: if [ -f security-report.md ]; then cat security-report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-security-report
          path: security-report.*
          if-no-files-found: warn
          retention-days: 30
